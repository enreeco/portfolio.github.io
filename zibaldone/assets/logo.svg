<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">

  <!-- Back book (slightly offset top-right) -->
  <rect x="20" y="6" width="74" height="88" rx="7" ry="7"
        fill="#2d2d2d"/>

  <!-- Front book cover - white fill with dark border -->
  <rect x="10" y="14" width="74" height="88" rx="7" ry="7"
        fill="white" stroke="#2d2d2d" stroke-width="4"/>

  <!-- Bottom page lines (spine detail) -->
  <line x1="16" y1="93" x2="78" y2="93" stroke="#2d2d2d" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="98" x2="78" y2="98" stroke="#2d2d2d" stroke-width="3" stroke-linecap="round"/>

  <!-- Bookmark ribbon at top-right (dark filled triangle notch) -->
  <polygon points="70,14 82,14 82,34 76,27 70,34"
           fill="#2d2d2d"/>

  <!-- Binding strip on left side -->
  <rect x="8" y="14" width="10" height="88" rx="5" ry="5"
        fill="white" stroke="#2d2d2d" stroke-width="3.5"/>

  <!-- Binding rings -->
  <circle cx="13" cy="40" r="7" fill="white" stroke="#2d2d2d" stroke-width="3.5"/>
  <circle cx="13" cy="66" r="7" fill="white" stroke="#2d2d2d" stroke-width="3.5"/>

  <!-- Letter Z -->
  <text x="47" y="76" font-family="Arial Black, Arial, sans-serif"
        font-size="52" font-weight="900"
        fill="#2d2d2d" text-anchor="middle">Z</text>

</svg>
